name: Build and Release

# Push a tag like v0.1.0 (or any v*) and this workflow builds MusicSorter on
# Windows + macOS in parallel, then publishes a release with both binaries.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install customtkinter Pillow mutagen just_playback miniaudio numpy pyinstaller

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed \
            --name MusicSorter \
            --icon icon.ico \
            --add-data "icon.ico;." \
            --add-data "icon.png;." \
            --collect-data customtkinter \
            --collect-binaries just_playback \
            --collect-binaries miniaudio \
            --collect-all cffi \
            --hidden-import _cffi_backend \
            sorter.py

      - name: Build (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed \
            --name MusicSorter \
            --icon icon.icns \
            --add-data "icon.icns:." \
            --add-data "icon.png:." \
            --collect-data customtkinter \
            --collect-binaries just_playback \
            --collect-binaries miniaudio \
            --collect-all cffi \
            --hidden-import _cffi_backend \
            sorter.py

      - name: Package macOS .app
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r MusicSorter-macos.zip MusicSorter.app

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: MusicSorter-windows
          path: dist/MusicSorter.exe

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: MusicSorter-macos
          path: dist/MusicSorter-macos.zip

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Check out source (for release notes)
        uses: actions/checkout@v4
        with:
          path: src

      - name: Publish to GitHub Releases (as draft)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/MusicSorter-windows/MusicSorter.exe
            artifacts/MusicSorter-macos/MusicSorter-macos.zip
          # Curated notes from the repo. The auto-generated commit list gets
          # appended below them.
          body_path: src/RELEASE_NOTES.md
          generate_release_notes: true
          # Lands as a draft so you can review the binaries + edit notes
          # before clicking "Publish release" yourself on the Releases page.
          draft: true
          prerelease: false
