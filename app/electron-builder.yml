appId: com.robogears.musicsorter
productName: MusicSorter
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
  # ffmpeg-static ships a platform-specific binary that needs to live on
  # disk (not inside app.asar) so child_process can exec it.
  - node_modules/ffmpeg-static/**
win:
  executableName: MusicSorter
nsis:
  artifactName: MusicSorter-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  category: public.app-category.music
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDownloadsFolderUsageDescription: MusicSorter reads audio files from your Downloads folder so it can sort them.
    - NSMusicUsageDescription: MusicSorter moves audio files into your music library folder.
  notarize: false
  # No Developer ID; we ad-hoc sign via the afterPack hook so arm64 Gatekeeper
  # accepts the build (otherwise unsigned arm64 builds show as "damaged").
  identity: null
  target:
    - target: dmg
      arch: [arm64]
dmg:
  artifactName: MusicSorter-${version}-${arch}.${ext}
afterPack: build/after-pack.js
npmRebuild: false
# Releases are cut by the GitHub Actions workflow, which uploads artifacts and
# creates a draft for manual publish. The in-app updater reads the published
# /releases/latest endpoint to detect new versions (see src/main/updater.ts).
publish: null
