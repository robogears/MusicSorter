<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>MusicSorter</title>
    <!-- CSP: allow blob: for in-memory audio (wavesurfer fetches it) and
         media-src so HTMLAudioElement can stream from blob URLs too.
         https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' blob:"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
